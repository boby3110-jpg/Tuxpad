[pytest]
testpaths = tests
pythonpath = src

# 1 つのテストが 60 秒を超えたら、全スレッドのトレースバックを吐いて中止する。
# GUI のテストは「本物のモーダルダイアログが開いてしまう」と、答える人が
# いないヘッドレス環境では永久に固まる（monkeypatch の差し替え先をモジュール
# の引っ越しに追随させ忘れると、実際にこうなる）。黙って止まったままだと
# 夜間の自動実行がそこで終わってしまうので、どのテストのどの行で止まったかを
# 出して落とす。テストは全部で 1 分ほど、いちばん遅い 1 件でも数秒なので、
# 60 秒はまともなテストには当たらない。
faulthandler_timeout = 60

# トレースバックを吐いたら、そこで**プロセスごと終わらせる**。
# これが無い（既定の false）と、pytest は 60 秒でトレースバックを出すものの
# **そのテストを待ち続ける**ため、結局固まったままになる。2026-08-11 の
# ルーティーンで実際に、ダンプは出ているのに全体が 10 分以上返ってこなかった。
# この設定は **pytest 9.0 以降**にしかない（8.x では「知らない設定」という
# 警告が出るだけで、従来どおりダンプのみ・待ち続ける動きになる）。
faulthandler_exit_on_timeout = true

# 警告が 1 つでも出たら、そのテストを**失敗にする**。
# 2026-08-14 のルーティーンで、テストが使っていた非推奨の Qt API
# （QApplication.setActiveWindow()）を本番と同じ経路に置き換え、実行ログの
# 警告をゼロにした。ただし**警告は出ていても緑のまま**なので、放っておくと
# 同じことがまた静かに紛れ込む（Qt 6 で非推奨の API は将来消える＝実機で
# 動かなくなる予告なので、気づける状態にしておきたい）。今ゼロなのだから、
# ここで固定してしまうのがいちばん安上がり。
#
# 将来 PySide6 や pytest 側の更新で、**こちらに直しようが無い**警告が出て
# 赤くなったときは、その 1 件だけを下に足して無視する（全部を緩めないこと）:
#     ignore:<メッセージの先頭>:<警告の種類>:<出しているモジュール>
filterwarnings =
    error
